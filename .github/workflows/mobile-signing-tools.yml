name: Aspia+ Mobile APK signing tools (no private keys)
on:
  push:
    branches: [feature/android-2.7.2-mobile2]
    paths: ['.github/workflows/mobile-signing-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'build-tools;36.0.0'
      - run: sudo apt-get update -qq && sudo apt-get install -y libc++1 libc++abi1
      - name: Package Android SDK official APK utilities
        run: |
          set -euo pipefail
          mkdir -p apk-signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" apk-signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" apk-signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apk-signing-tools/lib/
          cp -L "$(ldconfig -p | awk '/libc\\+\\+\\.so\\.1 /{print $NF;exit}')" apk-signing-tools/lib/libc++.so.1
          cp -L "$(ldconfig -p | awk '/libc\\+\\+abi\\.so\\.1 /{print $NF;exit}')" apk-signing-tools/lib/libc++abi.so.1
          test -s apk-signing-tools/lib/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: aspiaplus-official-sdk-signing-tools-linux
          path: apk-signing-tools/
          retention-days: 7
          if-no-files-found: error
