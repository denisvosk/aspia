name: Import upstream Aspia 2.7.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-aspia-2-7.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-aspia-2-7
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'denisvosk/aspia'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Import and verify the exact upstream release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: 488a77e13dc0c0ee07e4a6838e6ae400ae0c1c7f
          EXPECTED_TREE: fdd1fe5421a5489251c4689c95797c0a29f5427b
        run: |
          set -euo pipefail
          git clone --no-checkout --single-branch --branch v2.7.0 --no-tags https://github.com/dchapyshev/aspia.git source
          cd source
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-list --count HEAD)" = 4866
          git fsck --connectivity-only
          git remote rename origin upstream
          git remote add destination "https://github.com/$GITHUB_REPOSITORY.git"
          git config credential.helper '!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; fi; }; f'
          git fetch --no-tags destination refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          import_commit="$(printf '%s\n' 'Import exact upstream Aspia v2.7.0 with full history' '' 'Source: https://github.com/dchapyshev/aspia' "Upstream commit: $EXPECTED_COMMIT" 'The upstream tree is unchanged. Initial repository history is retained as the first parent.' | git commit-tree "$EXPECTED_TREE" -p "$GITHUB_SHA" -p "$EXPECTED_COMMIT")"
          test "$(git rev-parse "$import_commit^{tree}")" = "$EXPECTED_TREE"
          git push --atomic destination "$import_commit:refs/heads/main" "$import_commit:refs/heads/experiments" refs/tags/v2.7.0:refs/tags/v2.7.0
          git ls-remote destination refs/heads/main refs/heads/experiments refs/tags/v2.7.0
          {
            printf '## Aspia 2.7.0 imported\n\n'
            printf 'Upstream commit: `%s`\n\n' "$EXPECTED_COMMIT"
            printf 'Unchanged source tree: `%s`\n\n' "$EXPECTED_TREE"
            printf 'Main and experiments commit: `%s`\n\n' "$import_commit"
            printf 'Original upstream history: 4866 commits. Original v2.7.0 tag retained.\n'
            printf 'No application source code or upstream build scripts were executed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
